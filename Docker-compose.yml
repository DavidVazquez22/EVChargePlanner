services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: evchargeplanner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Database=evchargeplanner;Username=postgres;Password=postgres"
      ASPNETCORE_URLS: "http://+:8080"
      Jwt__Key: "una-clave-secreta-muy-larga-para-evchargeplanner-1234567890"

volumes:
  postgres_data:
  